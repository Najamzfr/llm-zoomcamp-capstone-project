# Theme for the Streamlit Cloud app (deploy/streamlit_app.py): calm "research tool" look.
# Tokens: paper #f7f6f3, surface #ffffff, sunk #efede8, line #e2dfd8, ink #1f1d1a,
# ink-2 #5b574f, accent #1d4ed8 (citations and links only), verified #1a7f4b.

[client]
toolbarMode = "minimal"  # hide the developer menu and Deploy button for visitors

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f1d1a"
backgroundColor = "#f7f6f3"
secondaryBackgroundColor = "#efede8"
textColor = "#1f1d1a"
linkColor = "#1d4ed8"
borderColor = "#e2dfd8"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#efede8"
secondaryBackgroundColor = "#f7f6f3"
